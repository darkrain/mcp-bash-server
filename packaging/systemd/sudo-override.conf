# Full sudo access is incompatible with the base service sandbox. These
# settings intentionally restore the normal host mount namespace and allow
# setuid sudo to work. Install only through mcp-bash-server-configure sudo.
[Service]
NoNewPrivileges=false
ProtectSystem=false
ProtectHome=false
ReadWritePaths=
PrivateTmp=false
ProtectKernelTunables=false
ProtectKernelModules=false
ProtectControlGroups=false
RestrictSUIDSGID=false
RestrictRealtime=false
RestrictNamespaces=false
LockPersonality=false
MemoryDenyWriteExecute=false
SystemCallFilter=
SystemCallErrorNumber=
